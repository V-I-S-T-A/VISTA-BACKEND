# app.yaml — DigitalOcean App Platform spec for VISTA-BACKEND
# Deploy via: doctl apps create --spec app.yaml
# (or paste into the App Platform "create from GitHub" wizard, which will
# also generate most of this automatically once it detects the Dockerfile)

name: vista-backend

services:
  - name: web
    github:
      repo: your-org/VISTA-BACKEND
      branch: main
      deploy_on_push: true
    dockerfile_path: vista/Dockerfile
    source_dir: vista
    http_port: 8000
    instance_size_slug: basic-xxs
    instance_count: 1
    envs:
      - key: DB_HOST
        value: ${vista-db.HOSTNAME}
      - key: DB_PORT
        value: ${vista-db.PORT}
      - key: DB_NAME
        value: ${vista-db.DATABASE}
      - key: DB_USER
        value: ${vista-db.USERNAME}
      - key: DB_PASSWORD
        value: ${vista-db.PASSWORD}
      - key: CELERY_BROKER_URL
        value: ${vista-redis.DATABASE_URL}
      - key: CELERY_RESULT_BACKEND
        value: ${vista-redis.DATABASE_URL}
      - key: SECRET_KEY
        type: SECRET
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "${APP_DOMAIN}"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://your-frontend.vercel.app"
      - key: CLOUDINARY_CLOUD_NAME
        type: SECRET
      - key: API_KEY
        type: SECRET
      - key: API_SECRET
        type: SECRET

workers:
  - name: celery-worker
    github:
      repo: your-org/VISTA-BACKEND
      branch: main
      deploy_on_push: true
    dockerfile_path: vista/Dockerfile
    source_dir: vista
    run_command: celery -A vista worker -l info
    instance_size_slug: basic-xxs
    instance_count: 1
    envs:
      - key: DB_HOST
        value: ${vista-db.HOSTNAME}
      - key: DB_PORT
        value: ${vista-db.PORT}
      - key: DB_NAME
        value: ${vista-db.DATABASE}
      - key: DB_USER
        value: ${vista-db.USERNAME}
      - key: DB_PASSWORD
        value: ${vista-db.PASSWORD}
      - key: CELERY_BROKER_URL
        value: ${vista-redis.DATABASE_URL}
      - key: CELERY_RESULT_BACKEND
        value: ${vista-redis.DATABASE_URL}
      - key: SECRET_KEY
        type: SECRET

databases:
  - name: vista-db
    engine: PG
    version: "16"
    production: true
  - name: vista-redis
    engine: REDIS
    version: "7"
    production: true